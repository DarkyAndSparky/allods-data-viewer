# cargo-deny 0.20.x: licenses, advisories, bans, sources. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
# proc-macro-error is an unmaintained build-time proc-macro. It comes only from the gtk-rs 0.18
# bindings that Tauri 2 uses on Linux (not compiled on Windows). Remove this entry when Tauri
# moves to newer gtk-rs. Reviewed 2026-11-14.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro via gtk-rs 0.18 (Tauri on Linux only)" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
