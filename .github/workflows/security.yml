name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: node scripts/check-repo.mjs
      - run: node --test scripts/guard.test.mjs scripts/check-repo.test.mjs

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo deny check
      - run: cargo audit

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm audit signatures
