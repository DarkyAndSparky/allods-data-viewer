[package]
name = "adv-desktop"
description = "Desktop app shell (Tauri 2) over adv-session; contains no format code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "allods-data-viewer"
path = "src/main.rs"

[features]
# Serve the built web UI from inside the executable instead of the dev server.
# Always on: the app is run with `cargo run`, not through the Tauri CLI dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
adv-core = { workspace = true }
adv-session = { workspace = true }
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true
