[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/session", "crates/desktop"]

[workspace.package]
version = "0.1.81"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/DarkyAndSparky/allods-data-viewer"

[workspace.dependencies]
flate2 = "1.1.11"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "optimization"] }
sevenz-rust2 = { version = "0.25.0", default-features = false }
rusty_mp3 = "=1.2.0"
theora-rs = "=0.1.0"
serde_json = "1.0.154"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2"] }
clap = { version = "4", features = ["derive"] }
adv-core = { path = "crates/core", version = "0.1.81" }
adv-session = { path = "crates/session", version = "0.1.81" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
