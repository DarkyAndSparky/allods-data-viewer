[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/DarkyAndSparky/allods-data-viewer"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
adv-core = { path = "crates/core", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
